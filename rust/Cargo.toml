[package]
name = "krate-core"
version = "0.1.0"
edition = "2021"
description = "Krate Toolkit — offline utility toolbox. Pure logic, no UI."
rust-version = "1.90"

# lib for the Rust CLI and tests, cdylib for the WinUI shell (P/Invoke) and Android (JNI).
[lib]
name = "krate_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "krate"
path = "src/main.rs"

[dependencies]
aes = "0.9.2"
atty = "0.2.14"
base64 = "0.23.0"
bzip2 = "0.6.1"
cbc = "0.2.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
fancy-regex = "0.19.0"
flate2 = "1.1.9"
hmac = "0.13.0"
icu_collator = "2.2.1"
icu_locale_core = "2.2.0"
lopdf = { version = "0.44.0", default-features = false }
lzma-rs = "0.3.0"
md-5 = "0.11.0"
num-bigint = "0.5.1"
pbkdf2 = "0.13.0"
qrcode = { version = "0.14.1", default-features = false }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["compress", "bzip2", "deflate", "ppmd", "util"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2", "time"] }

# POSIX side of the platform shims (clock, csprng, system). Scoped so the Windows build, which
# uses the Win32 APIs directly, does not gain a dependency it has no use for.
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
rqrr = "0.10.1"
